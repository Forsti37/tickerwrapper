<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Matchday-Ticker Wrapper – Aufstellung, Formation, Ligaportal" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>TickerWrapper</title>
  </head>
  <body>
    <header class="app-header">
      <div class="eyebrow">TickerWrapper</div>
      <div class="scoreline">
        <h1 id="match-title">Matchday</h1>
        <strong id="match-score">0:0</strong>
      </div>
      <div class="row">
        <span id="bridge-pill" class="bridge-pill off">Standalone</span>
      </div>
    </header>

    <nav class="tabs" aria-label="Hauptnavigation">
      <button type="button" data-tab="match" class="active">Match</button>
      <button type="button" data-tab="lineup">XI</button>
      <button type="button" data-tab="ticker">Ticker</button>
      <button type="button" data-tab="settings">Bausteine</button>
    </nav>

    <main id="view"></main>
    <p id="status" class="status" aria-live="polite"></p>

    <script src="./app.js"></script>
  </body>
</html>
